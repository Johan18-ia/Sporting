<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8B0000" />
    <title>Abrir Sporting</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #EEEEEE;
        color: #242424;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }

      main {
        width: min(100%, 420px);
        text-align: center;
      }

      h1 {
        margin: 0 0 28px;
        color: #8B0000;
        font-size: 2rem;
      }

      .actions {
        display: grid;
        gap: 12px;
      }

      .button {
        display: block;
        width: 100%;
        min-height: 50px;
        padding: 14px 18px;
        border: 2px solid #8B0000;
        border-radius: 6px;
        background: #FFFFFF;
        color: #8B0000;
        font: inherit;
        font-weight: 650;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }

      .button-primary {
        background: #8B0000;
        color: #FFFFFF;
      }

      .continue {
        display: inline-block;
        margin-top: 24px;
        color: #8B0000;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Abrir Sporting</h1>
      <div class="actions">
        <button class="button button-primary" id="open-app" type="button">Abrir la app</button>
        <a
          class="button"
          href="https://play.google.com/store/apps/details?id=com.sporting.app"
          rel="noopener noreferrer"
          target="_blank"
        >Descargar en Google Play</a>
        <a
          class="button"
          href="https://apps.apple.com/app/id0000000000"
          rel="noopener noreferrer"
          target="_blank"
        >Descargar en App Store</a>
      </div>
      <a class="continue" href="/">Continuar en la web</a>
    </main>
    <script>
      document.getElementById('open-app').addEventListener('click', () => {
        // Reemplazar por el esquema real cuando se configure.
        window.location.href = 'sporting://open';
      });
    </script>
  </body>
</html>
